name: Keep backend warm

# Render's free tier sleeps the backend after ~15 minutes of inactivity,
# which shows up as a slow cold start on the next request — bad for a
# recruiter's first click. This pings /health during expected demo hours
# (roughly US daytime/evening, UTC) to keep it warm. See
# docs/llds/deployment-infra.md.
#
# Requires a repo variable QASSIST_API_URL set to the deployed Render URL
# (Settings -> Secrets and variables -> Actions -> Variables).

on:
  schedule:
    - cron: "*/10 12-23 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: |
          if [ -z "${{ vars.QASSIST_API_URL }}" ]; then
            echo "QASSIST_API_URL repo variable not set — skipping ping."
            exit 0
          fi
          curl -sf "${{ vars.QASSIST_API_URL }}/health" || echo "ping failed (backend may be cold-starting)"
